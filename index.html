 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.deck=b.dataset.d;save();deckUI();next()})}
function prog(){const p=pool(),m=p.filter(c=>st(c).box>=3).length,seen=p.filter(c=>S.c[c.id]).length;$('prog').textContent=`Mastered ${m}/${p.length} · seen ${seen} · reviews ${S.n}`}
function draw(back){if(chart){chart.remove();chart=null}const el=$('cb');
 chart=LightweightCharts.createChart(el,{autoSize:true,grid:{vertLines:{visible:false},horzLines:{color:'#21262d'}},
 rightPriceScale:{borderVisible:false,mode:1},timeScale:{borderVisible:false},crosshair:{mode:0},layout:{background:{color:'#161b22'},textColor:'#8b949e',fontSize:11,attributionLogo:false},handleScroll:false,handleScale:false,kineticScroll:{touch:false,mouse:false}});
 const c=cur,bars=c.bars.filter(b=>back||b[0]<=c.cutT);
 const s=chart.addCandlestickSeries({upColor:'#2ea043',downColor:'#da3633',wickUpColor:'#2ea043',wickDownColor:'#da3633',borderVisible:false,priceLineVisible:false,lastValueVisible:false});
 s.setData(bars.map(b=>{const o={time:b[0],open:b[1],high:b[2],low:b[3],close:b[4]};if(b[0]>c.cutT){o.color=b[4]>=b[1]?'#58a6ff':'#a371f7';o.wickColor=o.color}return o}));
 const cols={SMA50:'#f2cc60',SMA200:'#ff7b72',EMA21:'#f2cc60',EMA55:'#79c0ff',RSI:'#d2a8ff'};
 if(c.ind)for(const k in c.ind){const opt={color:cols[k],lineWidth:k=='RSI'?1:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false};
  if(k=='RSI'){opt.priceScaleId='rsi'}const l=chart.addLineSeries(opt);l.setData(c.ind[k].filter(p=>back||p[0]<=c.cutT).map(p=>({time:p[0],value:p[1]})));
  if(k=='RSI'){chart.priceScale('rsi').applyOptions({scaleMargins:{top:.78,bottom:0},visible:false});s.priceScale().applyOptions({scaleMargins:{top:.05,bottom:.25}});l.createPriceLine({price:30,color:'#444c56',lineWidth:1,lineStyle:2});l.createPriceLine({price:70,color:'#444c56',lineWidth:1,lineStyle:2})}}
 if(back){s.setMarkers(c.marks.filter(m=>m[2]).map(m=>({time:m[0],position:m[1]=='H'?'aboveBar':'belowBar',color:'#ffd33d',shape:m[1]=='H'?'arrowDown':'arrowUp',text:m[2]})).concat([{time:c.cutT,position:'aboveBar',color:'#58a6ff',shape:'circle',text:'cut'}]).sort((a,b)=>a.time-b.time));
  c.hls.forEach(h=>s.createPriceLine({price:h[0],color:h[1].startsWith('fib')?'#d2a8ff':'#ffd33d',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:h[1]}));
  c.lines.forEach(l=>{const ls=chart.addLineSeries({color:'#ffd33d',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});ls.setData([{time:l[0][0],value:l[0][1]},{time:l[1][0],value:l[1][1]}])})}
 chart.timeScale().fitContent()}
function front(){cur=pick();const c=cur;$('card').innerHTML=`<div class="meta">${c.deck} · chart hidden: asset & date</div><div class="chartbox" id="cb"></div><div class="q">Name this setup</div>`+
 c.choices.map(x=>`<button class="ch" data-x="${x}">${x}</button>`).join('')+`<button class="flip" id="fl">Flip card</button>`;observe();draw(false);
 document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ch').forEach(o=>{if(o.dataset.x==c.setup)o.classList.add('ok')});if(b.dataset.x!=c.setup)b.classList.add('bad');cur.guess=b.dataset.x==c.setup;setTimeout(backSide,650)});$('fl').onclick=backSide;prog()}
function backSide(){const c=cur;$('card').innerHTML=`<div class="name">${c.setup}<span class="side ${c.side}">${c.side}</span></div><div class="meta">${c.asset} · ${c.start} → cut ${c.cut} → ${c.end}${cur.guess===undefined?'':cur.guess?' · ✅ you got it':' · ❌ you missed'}</div>
<div class="chartbox" id="cb"></div><div class="legend">Blue/purple candles = what happened after the cut.</div>
<div class="sec"><b>Outcome</b>${c.outcome}${c.note?' '+c.note:''}</div><div class="sec"><b>How to spot it</b>${c.how}</div><div class="sec"><b>Entry / stop / target</b>${c.rule}</div>
<div class="sec"><b>Hit rate</b><div class="stat">${c.stat}</div></div><div class="big"><button class="miss" id="ms">Missed</button><button class="got" id="gt">Got it</button></div>`;observe();draw(true);
 $('gt').onclick=()=>grade(true);$('ms').onclick=()=>grade(false);window.scrollTo(0,0)}
function grade(ok){const x=st(cur);S.n++;if(ok){x.box=Math.min(x.box+1,5);x.due=S.n+[2,4,8,16,32,64][x.box]}else{x.box=0;x.due=S.n+2}S.c[cur.id]=x;save();front()}
function observe(){if(ro)ro.disconnect();ro=new ResizeObserver(()=>{if(chart)requestAnimationFrame(()=>chart&&chart.timeScale().fitContent())});ro.observe($('cb'))}
function next(){front()}$('shuf').onclick=()=>{shuffle=!shuffle;$('shuf').classList.toggle('chip');$('shuf').textContent=shuffle?'🔀 Shuffle on':'🔀 Shuffle';next()};
$('reset').onclick=()=>{if(confirm('Reset progress?')){S={n:0,c:{},deck:S.deck};save();next()}};deckUI();next();
</script></body></html>
